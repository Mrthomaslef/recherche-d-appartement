name: Scrape annonces (quotidien)

on:
  schedule:
    - cron: "0 5 * * *"    # 6h/7h Paris
    - cron: "0 16 * * *"   # 17h/18h Paris
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/scrape.py
      - name: Commit des nouvelles données
        run: |
          git config user.name "appart-bot"
          git config user.email "appart-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: annonces du $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs || true
          git push
